# configs/model/attn_mel.yaml
# ──────────────────────────────────────────────────────────────────────────
# Model 3 (AttentivePoolingTransformer, external metadata) — Mel features
# Canonical winner from 8-config grid search (val F1 = 0.286).
#
# v2 adds separate dropout rates:
#   dropout_encoder : inside transformer layers  (was single `dropout`)
#   dropout_input   : after input projection     (NEW)
#   dropout_head    : after pooling, before head (was single `dropout`)
#   dropout_meta    : on the metadata query      (NEW — Model 3 only)
# ──────────────────────────────────────────────────────────────────────────

# Architecture
features: mel
d_model: 32
nhead: 4
num_layers: 1
use_external_meta: true
meta_dim: 2

# Dropout — v2 separate rates
dropout_encoder: 0.3   # canonical grid winner
dropout_input: 0.0     # baseline — set to 0.0 to match v1
dropout_head: 0.3      # same as encoder to match v1 baseline
dropout_meta: 0.0      # baseline — tune via Optuna

# Optimiser
lr: 0.001
